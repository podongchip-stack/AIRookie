<!doctype html>
<!--
  [demo 브랜치 전용] 시연 무대 — 대시보드 여러 개를 한 화면(1920×1080)에 연출해 배치한다.
  demo/player가 window.stage API로 창을 열고(addPane), 지금 일이 벌어지는 창을 크게(focus), 나머지는 오른쪽
  썸네일로 둔다. 각 창은 실제 대시보드(같은 출처 iframe)라 hub와 실제로 통신한다.
  "가상 시나리오 · 실제 병원의 응답이 아닙니다"는 항상 보인다. ⚠ develop에 병합하지 않는다.
-->
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>골든링크 시연 무대</title>
<style>
  @font-face { font-family: "Pretendard"; font-weight: 45 920; font-display: block; src: url("/demo-fonts/PretendardVariable.woff2") format("woff2-variations"); }
  :root { --bg:#000; --panel:#0A0A0A; --ink:#fff; --ink2:#E2E2E2; --mint:#0E9F6E; --coral:#E5484D; --navy:#000; --amber:#F5B94A; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Pretendard", sans-serif; }
  #top { position: absolute; left: 16px; right: 16px; top: 12px; height: 52px; display: flex; align-items: center; gap: 16px; }
  #brand { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  #brand b { color: #fff; }
  #scenario { font-size: 20px; font-weight: 700; color: var(--ink); }
  #scenario .no { display: inline-block; min-width: 46px; text-align: center; padding: 2px 10px; margin-right: 10px; border-radius: 999px; background: var(--mint); color: #fff; font-size: 16px; }
  #disclaimer { margin-left: auto; font-size: 16px; font-weight: 700; color: #FFD5D6; border: 2px solid var(--coral); background: rgba(229,72,77,.15); border-radius: 999px; padding: 6px 16px; white-space: nowrap; }
  #clock { font-size: 16px; color: var(--ink2); font-variant-numeric: tabular-nums; min-width: 70px; text-align: right; }

  .pane { position: absolute; border-radius: 14px; overflow: hidden; background: #F4F7FA; box-shadow: 0 6px 24px rgba(0,0,0,.35);
    transition: left .6s ease, top .6s ease, width .6s ease, height .6s ease, opacity .4s ease, box-shadow .4s ease; }
  .pane.focus { box-shadow: 0 0 0 3px var(--mint), 0 10px 40px rgba(0,0,0,.5); }
  .pane.hidden { opacity: 0; pointer-events: none; }
  .pane iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; background: #F4F7FA;
    transition: transform .6s ease; }
  .plabel { position: absolute; z-index: 3; font-size: 14px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; pointer-events: none; transition: left .6s ease, top .6s ease, width .6s ease, opacity .4s ease; }
  .plabel i { font-style: normal; display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; background: var(--ink2); }
  .plabel.focus { color: #fff; } .plabel.focus i { background: var(--mint); }
  .plabel.thumb { font-size: 12px; } .plabel.hidden { opacity: 0; }

  #caption { position: absolute; left: 16px; right: 16px; bottom: 12px; height: 92px; z-index: 20; display: none;
    background: #0A0A0A; border-left: 6px solid var(--mint); border-radius: 12px; padding: 12px 22px; overflow: hidden; }
  #caption .step { font-size: 15px; font-weight: 700; color: #7FE0B8; margin-bottom: 4px; }
  #caption .text { font-size: 26px; font-weight: 700; line-height: 1.3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #caption .sub { font-size: 16px; color: var(--ink2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #caption .step { white-space: nowrap; }
  #caption.reject { border-left-color: var(--coral); } #caption.reject .step { color: #FFB1B3; }
  #caption.ai { border-left-color: #fff; } #caption.ai .step { color: #fff; }

  /* 작동 원리 설명 상자(합본 영상용) — 오른쪽 썸네일 칸을 덮는다 */
  /* 눈에 띄게: 노란 강조색·큰 글씨·오른쪽에서 밀려 들어옴, 떠 있는 동안 썸네일은 어둡게 */
  #explain { position: absolute; z-index: 30; display: none; border-radius: 18px; padding: 26px 28px;
    background: #0A0A0A; border: 3px solid var(--amber); box-shadow: 0 0 0 6px rgba(245,185,74,.18), 0 16px 48px rgba(0,0,0,.6);
    transform: translateX(40px); opacity: 0; transition: transform .45s ease, opacity .45s ease; }
  #explain.show { transform: none; opacity: 1; }
  #explain .k { display: inline-block; font-size: 16px; font-weight: 800; color: #000; background: var(--amber); padding: 3px 12px; border-radius: 999px; }
  #explain .h { font-size: 32px; font-weight: 800; margin: 14px 0 16px; line-height: 1.25; letter-spacing: -0.01em; }
  #explain ul { list-style: none; display: flex; flex-direction: column; gap: 14px; }
  #explain li { font-size: 22px; line-height: 1.45; color: #fff; padding-left: 20px; position: relative; }
  #explain li::before { content: ""; position: absolute; left: 0; top: 12px; width: 9px; height: 9px; border-radius: 50%; background: var(--amber); }
  #explain li b { color: #FFE2A8; }
  body.explaining .pane.thumb:not(.hidden), body.explaining .plabel.thumb:not(.hidden) { opacity: .25; }
  /* 시나리오 소개 카드: 검은 판 · 흰 글자. 중요한 것(주 호소, 활력징후, 핵심 문장)만 크게, 나머지는 작게 */
  #intro { position: absolute; inset: 0; z-index: 50; display: none; background: #000; opacity: 0; transition: opacity .6s ease; color: #fff; }
  #intro.show { opacity: 1; }
  #intro .brand2 { position: absolute; left: 60px; top: 40px; display: flex; align-items: center; gap: 12px;
    font-size: 16px; font-weight: 700; letter-spacing: .22em; color: #fff; }
  #intro .brand2 i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #fff; }
  #intro .no { position: absolute; left: 180px; top: 270px; font-size: 24px; font-weight: 700; color: #fff; opacity: .85; }
  #intro .big { display: none; }
  #intro h1 { position: absolute; left: 180px; top: 315px; width: 1000px; font-size: 62px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.25; color: #fff; }
  #intro h1 em { font-style: normal; color: #FF6B6F; }
  #intro ul { position: absolute; left: 180px; top: 470px; width: 900px; list-style: none; display: flex; flex-direction: column; gap: 8px; }
  #intro li { font-size: 20px; color: #fff; opacity: .78; line-height: 1.4; padding-left: 18px; position: relative; }
  #intro li::before { content: ""; position: absolute; left: 0; top: 10px; width: 6px; height: 6px; border-radius: 50%; background: #fff; }
  #intro .tags { position: absolute; left: 180px; top: 680px; display: flex; gap: 8px; }
  #intro .tags span { font-size: 15px; font-weight: 600; padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.5); color: #fff; }
  #intro .disc { position: absolute; left: 180px; bottom: 50px; font-size: 15px; font-weight: 600; color: #fff; opacity: .7; }
  /* 대본 카드(시나리오 앞): 영화 대본처럼 장면 번호 · 장소 · 지문 · 대사. 검은 판 + 흰 글자 */
  #script { position: absolute; inset: 0; z-index: 55; display: none; background: #000; opacity: 0; transition: opacity .5s ease; color: #fff; padding: 70px 150px 0 150px; }
  #script.show { opacity: 1; }
  #script .tag { font-size: 16px; font-weight: 700; letter-spacing: .3em; opacity: .7; }
  #script h2 { font-size: 46px; font-weight: 800; letter-spacing: -0.03em; margin: 14px 0 22px; line-height: 1.2; }
  #script .rule { height: 2px; background: rgba(255,255,255,.5); margin-bottom: 8px; }
  #script .sc { display: grid; grid-template-columns: 110px 1fr 640px; gap: 0 30px; padding: 20px 0; border-bottom: 1px solid rgba(255,255,255,.18);
    opacity: 0; transform: translateY(14px); transition: opacity .45s ease, transform .45s ease; }
  #script.show .sc.on { opacity: 1; transform: none; }
  #script .sc .n { font-size: 34px; font-weight: 900; line-height: 1; }
  #script .sc .slug { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; }
  #script .sc .act { font-size: 19px; line-height: 1.45; opacity: .75; margin-top: 6px; }
  #script .sc .dlg { border-left: 3px solid #FF6B6F; padding-left: 20px; align-self: center; }
  #script .sc .dlg .who { font-size: 15px; font-weight: 800; letter-spacing: .12em; color: #FF8A8E; }
  #script .sc .dlg .say { font-size: 24px; font-weight: 600; line-height: 1.4; margin-top: 3px; }
  #script .sc.nodlg .dlg { visibility: hidden; }
  #script .foot { position: absolute; left: 150px; bottom: 44px; font-size: 15px; font-weight: 600; opacity: .7; }
  /* 모티프가 없는 카드(마지막 요약): 결과 줄을 크게 */
  #intro:not([data-motif="chest"]) h1 { font-size: 58px; top: 250px; width: 1600px; }
  #intro:not([data-motif="chest"]) .no { top: 205px; }
  #intro:not([data-motif="chest"]) ul { top: 400px; gap: 18px; width: 1400px; }
  #intro:not([data-motif="chest"]) li { font-size: 38px; opacity: 1; padding-left: 28px; }
  #intro:not([data-motif="chest"]) li::before { top: 18px; width: 10px; height: 10px; }
  #intro:not([data-motif="chest"]) .tags { top: 820px; }
  /* 흉통 모티프(motif=chest): 심전도와 활력징후를 크게 */
  #intro .motif { display: none; position: absolute; right: 130px; top: 250px; width: 620px; }
  #intro[data-motif="chest"] .motif { display: block; }
  #intro .motif .ecg { width: 100%; height: 220px; border: 2px solid rgba(255,255,255,.35); border-radius: 22px; padding: 14px 20px; position: relative; }
  #intro .motif .ecg path { fill: none; stroke: #FF6B6F; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1400; stroke-dashoffset: 1400; }
  #intro.show .motif .ecg path { animation: ecgdraw 1.8s ease-out .3s forwards; }
  @keyframes ecgdraw { to { stroke-dashoffset: 0; } }
  #intro .motif .heart { position: absolute; right: -24px; top: -58px; width: 110px; height: 110px; filter: drop-shadow(0 0 20px rgba(255,107,111,.6)); transform-origin: 50% 60%; }
  #intro.show .motif .heart { animation: beat 1.05s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.16); } 30% { transform: scale(1); } 45% { transform: scale(1.1); } }
  #intro .motif .vitals { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-top: 24px; }
  #intro .motif .vitals div { border: 2px solid rgba(255,255,255,.35); border-radius: 18px; padding: 16px 18px; }
  #intro .motif .vitals small { display: block; font-size: 18px; font-weight: 700; color: #fff; opacity: .8; }
  #intro .motif .vitals b { display: block; font-size: 58px; font-weight: 900; color: #FF8A8E; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1.1; }
  #intro .motif .vitals b.ok { color: #fff; }
  #intro .motif .vitals em { font-style: normal; font-size: 18px; font-weight: 600; color: #fff; opacity: .75; }
  #intro .motif .pain { margin-top: 18px; font-size: 22px; font-weight: 800; color: #fff; }
</style>
</head>
<body>
<div id="top">
  <div id="brand">골든<b>링크</b></div>
  <div id="scenario"></div>
  <div id="disclaimer">가상 시나리오 · 실제 병원의 응답이 아닙니다</div>
  <div id="clock"></div>
</div>
<div id="caption"><div class="step"></div><div class="text"></div><div class="sub"></div></div>
<div id="explain"><div class="k">작동 원리</div><div class="h"></div><ul></ul></div>
<div id="script"><div class="tag">SCENARIO</div><h2></h2><div class="rule"></div><div class="rows"></div><div class="foot">대본은 시연을 위한 연출입니다 · 가상 시나리오 · 실제 병원의 응답이 아닙니다</div></div>
<div id="intro"><div class="brand2"><i></i>GOLDENLINK</div><div class="no"></div><div class="big"></div><h1></h1><ul></ul><div class="tags"></div><div class="motif"><svg class="heart" viewBox="0 0 24 24"><path fill="#FF6B6F" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 2.7 4.8 6.3 4.8c2.1 0 3.9 1.1 5.7 3.3 1.8-2.2 3.6-3.3 5.7-3.3 3.6 0 5.4 3.6 3.9 7C19.5 16.4 12 21 12 21z"/></svg><div class="ecg"><svg viewBox="0 0 520 130" width="100%" height="100%" preserveAspectRatio="none"><path d="M0 70 H70 l10 -8 10 8 H130 l10 14 14 -70 16 100 12 -44 H230 l12 -12 14 12 H300 l10 14 14 -70 16 100 12 -44 H400 l12 -12 14 12 H520"/></svg></div><div class="vitals"><div><small>혈압</small><b>160/95</b><em>mmHg</em></div><div><small>맥박</small><b>100</b><em>회/분</em></div><div><small>산소포화도</small><b class="ok">95</b><em>%</em></div></div><div class="pain">가슴 가운데가 묵직하게 아픔 · 식은땀 · 숨참</div></div><div class="disc">가상 시나리오 · 실제 병원의 응답이 아닙니다 · 병원 정보는 E-Gen 실제 데이터</div></div>
<script>
(() => {
  const W = 1920, H = 1080, PAD = 16, TOP = 72, CAP = 116, LAB = 24;
  const SIDE_W = 430;
  // 아래 CAP 높이는 자막 띠 — 창은 그 위까지만(자막이 창 안의 버튼을 가리지 않게)
  let MAIN = { x: PAD, y: TOP, w: W - PAD * 3 - SIDE_W, h: H - TOP - CAP };
  // 차분한 모드(합본 영상용): 썸네일을 숨기고(thumbs=false), 설명 상자가 없으면 큰 화면을 가로 전체로(wide)
  let THUMBS = true;
  const SIDE = { x: W - PAD - SIDE_W, y: TOP, w: SIDE_W, h: H - TOP - CAP };
  // 창 종류별 가상 크기(이 크기로 렌더링한 뒤 축소·확대해 넣는다)
  const VIRTUAL = { dash: { w: 1440, h: 900 }, phone: { w: 390, h: 844 } };
  const panes = new Map(); // id -> {el, frame, kind, label, visible}
  let focused = [];
  const t0 = Date.now();

  // rect 맨 위 LAB 높이는 창 이름표 자리, 그 아래에 창
  function place(p, rect, vw, vh) {
    const inner = { x: rect.x, y: rect.y + LAB, w: rect.w, h: rect.h - LAB };
    const s = Math.min(inner.w / vw, inner.h / vh);
    const w = Math.round(vw * s), h = Math.round(vh * s);
    const left = Math.round(inner.x + (inner.w - w) / 2), top = Math.round(inner.y + (inner.h - h) / 2);
    p.el.style.left = left + "px";
    p.el.style.top = top + "px";
    p.lab.style.left = left + "px";
    p.lab.style.top = top - LAB + "px";
    p.lab.style.width = w + "px";
    p.el.style.width = w + "px";
    p.el.style.height = h + "px";
    p.frame.style.width = vw + "px";
    p.frame.style.height = vh + "px";
    p.frame.style.transform = `scale(${s})`;
  }

  // ── 카드 모드: 창 전체가 아니라 창 안의 카드(영역)만 확대해 보여 준다 ──
  // 영역은 대시보드 문서에서 찾는다(소스 수정 없음): {panel:"제목"} = 제목이 든 패널 · {tag:"li", has:"글자"} = 글자가 든 가장 안쪽 요소 ·
  // {css:"선택자", has?, nth?} · {any:[찾기…]} = 여러 영역의 합집합 · up:"section" = 찾은 요소를 품은 가장 가까운 조상으로 넓힘 · vh = 그 창의 가상 높이. 못 찾으면(아직 안 나타남) 창 전체를 보여 주다 나타나면 따라간다.
  const CARD_MAX_SCALE = 2.2, CARD_PAD = 10;
  const ZOOM_OUT_MS = 1100; // 전체 화면으로 물러나는 동안(.6초 전환) + 잠깐 머무는 시간
  let lastCardsKey = "";
  function findEl(doc, f) {
    const e = findOne(doc, f);
    if (e && f.parents) { let x = e; for (let i = 0; i < f.parents && x.parentElement; i++) x = x.parentElement; return x; } // parents: 부모로 n단계
    return e && f.up ? e.closest(f.up) : e; // up: 찾은 요소를 품은 가장 가까운 조상(예: "section")으로 넓힌다
  }
  function findOne(doc, f) {
    if (f.css) {
      const els = [...doc.querySelectorAll(f.css)];
      return f.has ? els.find((e) => e.textContent.includes(f.has)) : els[f.nth || 0];
    }
    if (f.panel) {
      // 제목은 h2일 수도, 새 디자인(2026-10-05)처럼 일반 div일 수도 있다. 제목 글자로 시작하는 말단 요소를 품은 section 중 가장 안쪽
      const hits = [...doc.querySelectorAll("section")].filter((sec) =>
        [...sec.querySelectorAll("h1,h2,h3,div,span")].some((t) => t.children.length === 0 && t.textContent.trim().startsWith(f.panel)));
      return hits.find((e) => !hits.some((o) => o !== e && e.contains(o)));
    }
    if (f.tag) {
      const els = [...doc.querySelectorAll(f.tag)].filter((e) => !f.has || e.textContent.includes(f.has));
      return els.find((e) => !els.some((o) => o !== e && e.contains(o))); // 가장 안쪽
    }
    return null;
  }
  function measureCrop(p) {
    try {
      const doc = p.frame.contentDocument;
      if (!doc || !p.crop) return null;
      const els = (p.crop.any || [p.crop]).map((f) => findEl(doc, f)).filter(Boolean);
      els.forEach((e) => e.scrollIntoView({ block: "nearest", inline: "nearest", behavior: "instant" }));
      const rects = els.map((e) => e.getBoundingClientRect()).filter((r) => r.width > 0 && r.height > 0);
      if (!rects.length) { console.warn("[카드 못 찾음]", p.id, JSON.stringify(p.crop)); return null; }
      const x0 = Math.max(0, Math.min(...rects.map((r) => r.left)) - CARD_PAD), y0 = Math.max(0, Math.min(...rects.map((r) => r.top)) - CARD_PAD);
      const x1 = Math.max(...rects.map((r) => r.right)) + CARD_PAD, y1 = Math.max(...rects.map((r) => r.bottom)) + CARD_PAD;
      return { x: Math.round(x0), y: Math.round(y0), w: Math.round(x1 - x0), h: Math.round(y1 - y0) };
    } catch { return null; }
  }
  function cardLayout(main) {
    const availH = MAIN.h - LAB, gap = PAD * 1.5;
    const items = main.map((p) => {
      const vw = p.kind === "phone" ? VIRTUAL.phone.w : 1440;
      // 대시보드 창의 가상 높이: 찾기에 vh를 주면 그 값(카드가 길쭉해 글자가 작아지면 낮추고, 아래가 잘리면 높인다)
      const vh = p.kind === "phone" ? VIRTUAL.phone.h : p.crop.vh || 900;
      return { p, vw, vh, cr: p.cropRect || { x: 0, y: 0, w: vw, h: vh } };
    });
    let ss = items.map((i) => Math.min(availH / i.cr.h, CARD_MAX_SCALE));
    const total = () => items.reduce((a, i, k) => a + i.cr.w * ss[k], 0) + gap * (items.length - 1);
    const shrink = Math.min(1, MAIN.w / total());
    ss = ss.map((s) => s * shrink);
    let x = MAIN.x + (MAIN.w - total()) / 2;
    items.forEach(({ p, vw, vh, cr }, k) => {
      const s = ss[k], w = Math.round(cr.w * s), h = Math.round(cr.h * s);
      const left = Math.round(x), top = Math.round(MAIN.y + LAB + (availH - h) / 2);
      p.el.style.left = left + "px"; p.el.style.top = top + "px"; p.el.style.width = w + "px"; p.el.style.height = h + "px";
      p.lab.style.left = left + "px"; p.lab.style.top = top - LAB + "px"; p.lab.style.width = w + "px";
      p.frame.style.width = vw + "px"; p.frame.style.height = vh + "px";
      p.frame.style.transform = `translate(${-cr.x * s}px, ${-cr.y * s}px) scale(${s})`;
      x += w + gap;
    });
  }
  // 카드는 내용에 따라 나타나고 커지므로 주기적으로 다시 잰다 — 바뀌면 부드럽게 따라간다
  setInterval(() => {
    let changed = false;
    for (const p of panes.values()) {
      if (!p.crop || !focused.includes(p.id)) continue;
      const r = measureCrop(p), o = p.cropRect;
      if (!r) continue; // 카드가 사라지면(사건 종료 등) 직전 영역을 유지한다 — 창 전체로 튀지 않게
      const same = o && ["x", "y", "w", "h"].every((k) => Math.abs(r[k] - o[k]) <= 2);
      if (!same) { p.cropRect = r; changed = true; }
    }
    if (changed) layout();
  }, 200);

  function layout() {
    const main = focused.map((id) => panes.get(id)).filter(Boolean);
    const cardMode = main.some((p) => p.crop);
    const rest = THUMBS ? [...panes.values()].filter((p) => p.visible && !main.includes(p)) : [];
    // 크게: 하나면 주 영역 전체, 휴대폰+대시보드면 휴대폰 왼쪽 좁게, 대시보드 둘이면 좌우 반반
    if (cardMode) {
      cardLayout(main);
    } else if (main.length === 1) {
      const p = main[0];
      const v = p.kind === "phone" ? VIRTUAL.phone : { w: 1440, h: Math.round(1440 * (MAIN.h - LAB) / MAIN.w) };
      place(p, MAIN, v.w, v.h);
    } else if (main.length >= 2) {
      const phones = main.filter((p) => p.kind === "phone");
      const dashes = main.filter((p) => p.kind !== "phone");
      let x = MAIN.x;
      for (const p of phones) {
        const w = Math.round((MAIN.h - LAB) * VIRTUAL.phone.w / VIRTUAL.phone.h);
        place(p, { x, y: MAIN.y, w, h: MAIN.h }, VIRTUAL.phone.w, VIRTUAL.phone.h);
        x += w + PAD;
      }
      const each = (MAIN.x + MAIN.w - x - PAD * (dashes.length - 1)) / Math.max(1, dashes.length);
      for (const p of dashes) {
        const vw = each < 900 ? 1100 : 1440;
        place(p, { x, y: MAIN.y, w: each, h: MAIN.h }, vw, Math.round(vw * (MAIN.h - LAB) / each));
        x += each + PAD;
      }
    }
    // 썸네일: 오른쪽 세로로, 개수에 맞춰 높이를 나눈다
    const n = rest.length;
    const gap = 12;
    const slotH = n ? (SIDE.h - gap * (n - 1)) / n : 0;
    rest.forEach((p, i) => {
      const v = p.kind === "phone" ? VIRTUAL.phone : VIRTUAL.dash;
      place(p, { x: SIDE.x, y: SIDE.y + i * (slotH + gap), w: SIDE.w, h: Math.min(slotH, LAB + SIDE.w * v.h / v.w) }, v.w, v.h);
    });
    for (const p of panes.values()) {
      const isMain = main.includes(p);
      p.el.classList.toggle("focus", isMain);
      p.el.classList.toggle("thumb", !isMain);
      const hide = !isMain && (!p.visible || !THUMBS);
      p.el.classList.toggle("hidden", hide);
      p.lab.className = "plabel " + (isMain ? "focus" : "thumb") + (hide ? " hidden" : "");
    }
  }

  // 영상 문구에 긴 줄표(—, –, ㅡ)를 쓰지 않는다 — 가운뎃점으로 바꾼다
  const ns = (t) => String(t ?? "").replace(/\s*[—–―ㅡ]\s*/g, " · ");
  const stage = {
    configure({ thumbs = true, wide = false } = {}) {
      THUMBS = thumbs;
      MAIN = { x: PAD, y: TOP, w: wide ? W - PAD * 2 : W - PAD * 3 - SIDE_W, h: H - TOP - CAP };
      layout();
    },
    setScenario(no, title) {
      document.getElementById("scenario").textContent = `시나리오 ${parseInt(no, 10)}번 : ${ns(title)}`;
    },
    // 창을 하나 연다. 같은 id면 주소만 바꾼다. iframe이 다 뜨면 끝난다.
    addPane(id, { url, kind = "dash", label = "", visible = true }) {
      return new Promise((resolve) => {
        let p = panes.get(id);
        if (!p) {
          const el = document.createElement("div");
          el.className = "pane hidden";
          el.id = "pane-" + id;
          const frame = document.createElement("iframe");
          frame.id = "frame-" + id;
          frame.setAttribute("allow", "microphone; autoplay; screen-wake-lock");
          const lab = document.createElement("div");
          lab.className = "plabel hidden";
          el.append(frame);
          document.body.append(el, lab);
          p = { id, el, frame, lab, kind, label, visible, crop: null, cropRect: null };
          panes.set(id, p);
        }
        p.kind = kind; p.visible = visible;
        p.lab.innerHTML = `<i></i>${ns(label)}`;
        p.frame.onload = () => { forcePretendard(p.frame); resolve(true); };
        p.frame.src = url;
        layout();
      });
    },
    setLabel(id, label) {
      const p = panes.get(id);
      if (p) p.lab.innerHTML = `<i></i>${ns(label)}`;
    },
    setVisible(id, visible) {
      const p = panes.get(id);
      if (p) { p.visible = visible; layout(); }
    },
    focus(ids) { focused = Array.isArray(ids) ? ids : [ids]; layout(); },
    // 카드 모드: { 창id: 찾기 } — 나열한 창의 해당 카드만 크게 보여 준다. 빈 객체면 카드 모드 해제.
    // 장면이 바뀌어 카드가 달라지면 먼저 새 장면의 창을 전체 화면으로 보여 주고(포커스 아웃) 잠깐 머문 뒤 카드로 확대한다(포커스 인).
    // 같은 카드가 이어질 땐 건너뛴다.
    async cards(map) {
      const ids = Object.keys(map);
      const key = JSON.stringify(map);
      const changed = key !== lastCardsKey;
      lastCardsKey = key;
      if (ids.length && changed) {
        for (const p of panes.values()) { p.crop = null; p.cropRect = null; }
        focused = ids;
        layout();
        await new Promise((r) => setTimeout(r, ZOOM_OUT_MS));
      }
      for (const p of panes.values()) { p.crop = map[p.id] || null; p.cropRect = null; }
      if (ids.length) focused = ids;
      for (const id of ids) { const p = panes.get(id); if (p) p.cropRect = measureCrop(p); }
      layout();
    },
    caption(step, text, sub = "", tone = "") {
      const c = document.getElementById("caption");
      if (!text) { c.style.display = "none"; return; }
      c.className = tone;
      c.querySelector(".step").textContent = ns(step);
      c.querySelector(".text").textContent = ns(text);
      c.querySelector(".sub").textContent = ns(sub);
      c.style.display = "block";
    },
    // 작동 원리 상자 — 오른쪽 칸(썸네일 자리)에 띄운다. title이 없으면 숨긴다
    explain(title, lines = []) {
      const e = document.getElementById("explain");
      if (!title) { e.classList.remove("show"); document.body.classList.remove("explaining"); setTimeout(() => { if (!e.classList.contains("show")) e.style.display = "none"; }, 450); return; }
      Object.assign(e.style, { left: SIDE.x + "px", top: SIDE.y + "px", width: SIDE.w + "px", maxHeight: SIDE.h + "px" });
      e.querySelector(".h").textContent = ns(title);
      e.querySelector("ul").innerHTML = lines.map((l) => `<li>${ns(l)}</li>`).join("");
      e.style.display = "block";
      document.body.classList.add("explaining");
      e.classList.remove("show"); void e.offsetWidth; e.classList.add("show");
    },
    // 대본 카드: scenes = [{slug, action, lines:[{who, text}]}]. 장면이 차례로 나타난다
    script({ no, title, scenes = [], stepMs = 450 }, show = true) {
      const el = document.getElementById("script");
      if (!show) { el.classList.remove("show"); setTimeout(() => (el.style.display = "none"), 600); return; }
      el.querySelector("h2").textContent = `시나리오 ${parseInt(no, 10)}번 : ${ns(title)}`;
      el.querySelector(".rows").innerHTML = scenes.map((c, i) => {
        const d = (c.lines || [])[0];
        return `<div class="sc${d ? "" : " nodlg"}"><div class="n">S#${i + 1}</div><div><div class="slug">${ns(c.slug)}</div><div class="act">${ns(c.action)}</div></div>` +
          `<div class="dlg">${d ? `<div class="who">${ns(d.who)}</div><div class="say">“${ns(d.text)}”</div>` : ""}</div></div>`;
      }).join("");
      el.style.display = "block";
      requestAnimationFrame(() => {
        el.classList.add("show");
        el.querySelectorAll(".sc").forEach((r, i) => setTimeout(() => r.classList.add("on"), 250 + i * stepMs));
      });
    },
    intro({ no, title, lines = [], tags = [], motif = "" }, show = true) {
      const el = document.getElementById("intro");
      if (!show) { el.classList.remove("show"); setTimeout(() => (el.style.display = "none"), 650); return; }
      el.querySelector(".no").textContent = `시나리오 ${parseInt(no, 10)}번`;
      el.dataset.motif = motif || "";
      el.querySelector("h1").textContent = ns(title);
      el.querySelector("ul").innerHTML = lines.map((l) => `<li>${ns(l)}</li>`).join("");
      el.querySelector(".tags").innerHTML = tags.map((t) => `<span>${ns(t)}</span>`).join("");
      el.style.display = "flex";
      requestAnimationFrame(() => el.classList.add("show"));
    },
  };
  // 각 창(같은 출처 iframe)의 글꼴을 Pretendard로 고정 — 대시보드 소스는 건드리지 않고 문서마다 스타일을 주입한다
  function forcePretendard(frame) {
    const doc = frame.contentDocument;
    if (!doc || doc.getElementById("demo-pretendard")) return;
    const st = doc.createElement("style");
    st.id = "demo-pretendard";
    st.textContent = `@font-face { font-family: "Pretendard"; font-weight: 45 920; font-display: block; src: url("/demo-fonts/PretendardVariable.woff2") format("woff2-variations"); }
      html, body, body *, button, input, select, textarea { font-family: "Pretendard", sans-serif !important; }
      nextjs-portal, [data-nextjs-toast], [data-nextjs-dev-tools-button] { display: none !important; }`; // 개발 서버의 이슈 표시("1 Issue")는 영상에 안 나오게
    doc.head.append(st);
  }
  // 영상에 짙은 남색을 쓰지 않는다: 각 창(대시보드)의 짙은 남색·청색 글자/배경/테두리를 검정으로 바꾼다. 대시보드 소스는 건드리지 않는다
  const NAVY_PROPS = [["color", "color"], ["backgroundColor", "background-color"], ["borderTopColor", "border-top-color"], ["borderRightColor", "border-right-color"],
    ["borderBottomColor", "border-bottom-color"], ["borderLeftColor", "border-left-color"], ["fill", "fill"], ["stroke", "stroke"]];
  function isNavy(c) {
    const m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c || "");
    if (!m) return false;
    const r = +m[1], g = +m[2], b = +m[3];
    return Math.max(r, g, b) < 190 && b - r >= 60 && b >= g;
  }
  function fixNavy(frame) {
    const doc = frame.contentDocument, win = frame.contentWindow;
    if (!doc || !doc.body) return;
    for (const el of doc.body.querySelectorAll("*")) {
      const cs = win.getComputedStyle(el);
      for (const [prop, css] of NAVY_PROPS) if (isNavy(cs[prop])) el.style.setProperty(css, "#000", "important");
    }
  }
  setInterval(() => { for (const p of panes.values()) { try { fixNavy(p.frame); } catch {} } }, 600);
  window.stage = stage;
  setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    document.getElementById("clock").textContent = `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
  }, 500);
})();
</script>
</body>
</html>
